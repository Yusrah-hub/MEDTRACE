      loadProviderDashboard();
    }
  }
  if(id==='v-scan'){
    const inp = document.getElementById('scan-qr-token-input');
    const lastToken = localStorage.getItem('medtrace_last_qr_token') || (state.profile ? state.profile.qr_token : '');
    if(inp && !inp.value && lastToken){
      inp.value = lastToken;
    }
    if (typeof startQrScanner === 'function') {
      startQrScanner();
    }
  }
  if(id==='v-pfound'){
    renderScannedPatientUI(state.scannedPatient);
  }
  if(id==='v-preq'){
    const sub = document.getElementById('preq-patient-sub');
    if (sub && state.scannedPatient) {
      sub.textContent = `Requesting consultation access for: ${state.scannedPatient.patient_name || 'Patient'}`;
    }
  }
  if(id==='v-pinfo'){
    const pid = state.activePatientId || (state.scannedPatient ? state.scannedPatient.patient_id : null);
    if (pid) {
      if (state.providerPatientRecords) {
        renderProviderPatientRecordsUI(state.providerPatientRecords, state.activePatientName);
      } else {
        loadProviderPatientRecords(pid, state.activePatientName);
      }
    }
  }
  if(id==='v-emerg-scan'){
    const inp = document.getElementById('emerg-token-input');
    const lastToken = localStorage.getItem('medtrace_last_qr_token') || (state.profile ? state.profile.qr_token : '');
    if(inp && !inp.value && lastToken){
      inp.value = lastToken;
    }
    if (typeof startEmergencyQrScanner === 'function') {
      startEmergencyQrScanner();
    }
  }
  if(id==='v-emerg-info'){
    if (state.emergencyProfile) {
      renderEmergencyInfoUI(state.emergencyProfile);
    }
  }
}

/* ---- Group 12: Backend Health Check ---- */
let backendHealthChecked = false;

async function checkBackendHealth() {
  if (backendHealthChecked) return;
  backendHealthChecked = true;

  updateBackendStatusUI('checking');
  try {
    const data = await apiRequest('/health');
    if (data && data.status === 'ok') {
      state.backendHealthy = true;
      state.backendService = data.service || 'medtrace-api';
      updateBackendStatusUI('healthy');
    } else {
      state.backendHealthy = false;
      updateBackendStatusUI('unhealthy');
    }
  } catch (err) {
    console.warn('Backend connectivity note:', err.message || err);
    state.backendHealthy = false;
    updateBackendStatusUI('unhealthy');
  }
}

function updateBackendStatusUI(status) {
  const dot = document.getElementById('backend-status-dot');
  const txt = document.getElementById('backend-status-text');
  const topDot = document.getElementById('topbar-status-dot');

  if (status === 'healthy') {
    if (dot) {
      dot.style.background = '#10b981';
      dot.title = `Connected to ${state.backendService || 'backend'}`;
    }
    if (txt) {
      txt.textContent = 'Connected';
      txt.style.color = '#10b981';
      txt.title = `Connected to ${state.backendService || 'backend'}`;
    }
    if (topDot) {
      topDot.style.background = '#10b981';
      topDot.title = `Connected to ${state.backendService || 'backend'}`;
    }
  } else if (status === 'checking') {
    if (dot) {
      dot.style.background = '#94a3b8';
      dot.title = 'Connecting to backend...';
    }
    if (txt) {
      txt.textContent = 'Connecting...';
      txt.style.color = 'var(--gray)';
    }
    if (topDot) {
      topDot.style.background = '#94a3b8';
      topDot.title = 'Connecting to backend...';
    }
  } else {
    if (dot) {
      dot.style.background = '#f59e0b';
      dot.title = 'Backend offline or unreachable';
    }
    if (txt) {
      txt.textContent = 'Offline';
      txt.style.color = '#f59e0b';
      txt.title = 'Backend offline or unreachable';
    }
    if (topDot) {
      topDot.style.background = '#f59e0b';
      topDot.title = 'Backend offline or unreachable';
    }
  }
}

/* ---- boot ---- */
document.getElementById('viewport').appendChild(document.getElementById('tpl-views').content.cloneNode(true));
buildNav();

// Group 12: Lightweight, non-blocking backend connectivity check
checkBackendHealth();

/* Check for direct emergency lookup via URL parameter or hash */
const urlParams = new URLSearchParams(window.location.search);
const hash = window.location.hash || '';
let emergencyToken = urlParams.get('emergency') || urlParams.get('qr_token');
if (!emergencyToken && hash.includes('emergency/')) {
  emergencyToken = hash.split('emergency/')[1].split('?')[0].trim();
} else if (!emergencyToken && hash.includes('emergency=')) {
  emergencyToken = hash.split('emergency=')[1].split('&')[0].trim();
}

if (emergencyToken) {
  // CRITICAL: Unauthenticated Emergency Flow directly accessible without login
  lookupEmergency(emergencyToken);
} else if (state.auth && state.auth.token) {
  if (state.role === 'patient') {
    loadPatientDashboard();
    loadPatientRecords();
    loadPatientQrImage();
    loadAccessRequests();
    loadPatientAccessHistory();
  } else if (state.role === 'provider') {
    loadProviderDashboard();
  }
  go(state.role === 'provider' ? 'v-pdash' : 'v-dash', true);
} else {
  go('v-welcome', true);
}
</script>
