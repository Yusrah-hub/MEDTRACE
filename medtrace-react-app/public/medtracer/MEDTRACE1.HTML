<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedTrace</title>
<style>
:root{
  --navy:#0c2340; --navy2:#0d2847; --blue:#1976d2; --blue-l:#e3f2fd;
  --gray:#64748b; --border:#e2e8f0; --bg:#f5f7fa; --card:#ffffff;
  --danger:#d32f2f; --success:#2e7d32; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy);}
button{font-family:inherit;cursor:pointer;border:none;}
input,select{font-family:inherit;}
a{color:inherit;text-decoration:none;}

/* ---- Shell ---- */
#shell{display:flex;min-height:100vh;}
#sidebar{width:230px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0;}
#sidebar h1{font-size:1.3rem;margin-bottom:26px;padding-left:8px;}
#sidebar .navlist a{display:flex;gap:10px;align-items:center;padding:11px 10px;border-radius:10px;color:#b9c6da;font-size:.92rem;font-weight:600;margin-bottom:4px;}
#sidebar .navlist a.active,#sidebar .navlist a:hover{background:var(--blue);color:#fff;}
#sidebar .role-switch{margin-top:auto;font-size:.72rem;color:#8fa2bd;padding:8px;}
#sidebar .role-switch button{background:none;color:#21189a;font: size 0.75em;}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{display:none;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
#topbar button{background:none;font-size:1.2rem;color:var(--navy);}
#topbar h2{font-size:1rem;}
#content{flex:1;padding:30px;display:flex;justify-content:center;}
.wrap{width:100%;max-width:460px;}
#bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:9;}
#bottomnav a{display:flex;flex-direction:column;align-items:center;font-size:.6rem;color:var(--gray);font-weight:600;gap:2px;flex:1;}
#bottomnav a.active{color:var(--blue);}
#bottomnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}

@media (max-width:860px){
  #sidebar{display:none;}
  #topbar{display:flex;}
  #bottomnav{display:flex;}
  #content{padding:16px 16px 76px;}
}

/* ---- Generic view elements ---- */
.view{display:none;}
.view.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{background:var(--card);border-radius:var(--radius);padding:22px;border:1px solid var(--border);}
.center{text-align:center;}
h2.title{font-size:1.4rem;font-weight:800;margin-bottom:6px;}
p.sub{color:var(--gray);font-size:.88rem;margin-bottom:18px;line-height:1.4;}
.step{color:var(--blue);font-weight:700;font-size:.75rem;margin-bottom:6px;}
label{display:block;font-size:.78rem;font-weight:700;color:var(--navy);margin:14px 0 5px;}
input[type=text],input[type=password],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:.9rem;background:#fbfcfe;}
input:focus,select:focus{outline:2px solid var(--blue);}
.btn{display:block;width:100%;padding:13px;border-radius:14px;font-weight:700;font-size:.88rem;text-align:center;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-outline{background:#fff;color:var(--blue);border:1.5px solid var(--blue)!important;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:none;color:var(--blue);font-weight:700;}
.row{display:flex;gap:10px;}
.row .btn{flex:1;}
.link{color:var(--blue);font-weight:700;}
.foot-link{text-align:center;margin-top:16px;font-size:.82rem;color:var(--gray);}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-l);color:var(--blue);padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:600;margin:0 6px 6px 0;}
.chip button{background:none;color:var(--blue);font-weight:800;}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.section-title{font-size:.8rem;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:.03em;margin:20px 0 8px;}
.section-title:first-child{margin-top:0;}
.otp-row{display:flex;gap:10px;justify-content:center;margin:18px 0;}
.otp-row input{width:46px;height:52px;text-align:center;font-size:1.2rem;font-weight:700;}
.checkline{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--navy);margin:12px 0;}
.checkline input{width:auto;}
.qr-box{width:180px;height:180px;background:#fff;border:2px solid var(--navy);border-radius:14px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);letter-spacing:1px;background-image:
  repeating-linear-gradient(90deg,#0c2340 0 6px,transparent 6px 12px),
  repeating-linear-gradient(#0c2340 0 6px,transparent 6px 12px);
  background-size:24px 24px;background-blend-mode:multiply;background-color:#fff;}
.qr-box span{background:#fff;padding:6px 10px;border-radius:6px;font-size:.75rem;}
.banner{background:var(--navy2);color:#fff;border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:20px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.tile{background:var(--navy2);color:#fff;border-radius:12px;padding:14px 6px;text-align:center;font-size:.72rem;font-weight:700;cursor:pointer;}
.qcard{display:flex;align-items:center;gap:8px;background:var(--navy2);color:#fff;border-radius:12px;padding:12px;flex:1;font-size:.72rem;font-weight:700;cursor:pointer;}
.qgrid{display:flex;gap:10px;margin-bottom:16px;}
.badge{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:20px;}
.badge.ok{background:#e8f5e9;color:var(--success);}
.badge.warn{background:#fff3e0;color:#e65100;}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:30px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;z-index:99;}
.toast.show{opacity:1;bottom:100px;}
@media (max-width:860px){.toast.show{bottom:96px;}}
.hidden{display:none!important;}
.warn-banner{background:#fff3e0;color:#e65100;border-radius:12px;padding:12px 14px;font-size:.82rem;font-weight:600;margin-bottom:16px;display:flex;gap:8px;align-items:center;}
@media (min-width:861px){
  #shell{height:100vh;min-height:100vh;overflow:hidden;}
  #sidebar{height:100vh;min-height:100vh;position:sticky;top:0;}
  #main{height:100vh;min-height:0;}
  #content{min-height:0;padding:32px clamp(32px,4vw,64px);align-items:stretch;overflow-y:auto;}
  .wrap{width:100%;max-width:1600px;min-height:100%;}
  .view.active{width:100%;min-height:calc(100vh - 64px);}
  .view[data-nav="none"]{max-width:1180px;margin-inline:auto;}
  .view.active > .card{min-height:calc(100vh - 64px);}
  .card{padding:28px;}
  h2.title{font-size:clamp(1.65rem,1.45rem + .4vw,2rem);line-height:1.3;}
  p.sub{font-size:clamp(1.02rem,.98rem + .14vw,1.14rem);line-height:1.65;}
  p[style*="font-size:.88rem"]{font-size:1rem!important;line-height:1.65!important;}
  label{font-size:.95rem;}
  input[type=text],input[type=password],input[type=date],select,textarea{min-height:50px;padding:14px 16px;font-size:1rem;line-height:1.5;}
  .btn{min-height:50px;padding:14px 16px;font-size:1rem;line-height:1.45;}
  .section-title{font-size:.92rem;letter-spacing:.04em;}
  .step{font-size:.84rem;}
  .foot-link{font-size:.92rem;}
  .chip{padding:7px 14px;font-size:.92rem;}
  .list-item{font-size:1rem;line-height:1.6;}
  .tile,.qcard{font-size:.9rem;line-height:1.5;}
  .badge{font-size:.76rem;}
  .checkline{font-size:.95rem;line-height:1.5;}
  .warn-banner{font-size:.92rem;line-height:1.5;}
  .qr-box span{font-size:.85rem;}
  #sidebar .navlist a{font-size:1rem;}
  #sidebar .role-switch,#sidebar .role-switch button{font-size:.8rem;}
}
</style>
</head>
<body>

<div id="shell">
  <aside id="sidebar">
    <h1>MedTrace</h1>
    <div class="navlist" id="sidebarNav"></div>
    <div class="role-switch">
      <span style="color:var(--gray);font-size:.78rem">Current Portal:</span><br>
      <b id="roleLabel">Patient Portal</b><br>
      <button id="switchRoleBtn" onclick="switchRole()" style="margin-top:6px;width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600">Switch to Provider Portal</button>
      <div id="backend-status-container" style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:0.75rem;cursor:pointer" title="Click to re-check connectivity" onclick="backendHealthChecked=false;checkBackendHealth();">
        <span id="backend-status-dot" style="width:7px;height:7px;border-radius:50%;background:#94a3b8;display:inline-block"></span>
        <span id="backend-status-text" style="color:var(--gray);font-weight:600">Connecting...</span>
      </div>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="backBtn" onclick="goBack()">&#8592;</button>
      <h2 id="topTitle">MedTrace</h2>
      <div id="topbar-status-dot" style="margin-left:auto;width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block;cursor:pointer" title="Click to re-check connectivity" onclick="backendHealthChecked=false;checkBackendHealth();"></div>
    </div>
    <div id="content"><div class="wrap" id="viewport"></div></div>
    <nav id="bottomnav"></nav>
  </div>
</div>

<div class="toast" id="toast"></div>

<template id="tpl-views">
<!-- ===================== SHARED / AUTH ===================== -->
<section class="view" id="v-welcome" data-title="MedTrace" data-nav="none">
  <div class="card center">
    <div style="font-size:3rem">🩺</div>
    <h2 class="title">Your health information, wherever you go</h2>
    <p class="sub">Securely store and share your essential medical information when you need it.</p>
    <button class="btn btn-primary" onclick="state.role='patient';buildNav();go('v-signup')">Create Patient Account</button>
    <button class="btn btn-outline" style="margin-top:10px" onclick="state.role='patient';buildNav();go('v-login')">Patient Login</button>
    <button class="btn btn-danger" id="welcome-emerg-btn" style="margin-top:12px;background:#e11d48;color:#fff;width:100%;font-weight:700;" onclick="go('v-emerg-scan')">🚨 Emergency QR Lookup</button>
    <div class="foot-link" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
      Are you a healthcare provider?<br>
      <a class="link" onclick="state.role='provider';buildNav();go('v-plogin')">Provider Login</a> &middot; 
      <a class="link" onclick="state.role='provider';buildNav();go('v-psignup')">Register as Provider</a>
    </div>
  </div>
</section>

<section class="view" id="v-signup" data-title="Create Account" data-nav="none">
  <div class="card">
    <h2 class="title">Create Patient Account</h2>
    <p class="sub">Sign up to create and manage your personal medical passport</p>
    <form id="signup-form" onsubmit="handleSignup(event, 'patient')">
      <label>Full Name</label><input type="text" id="su-name" placeholder="Full Name" required>
      <label>Email Address</label><input type="email" id="su-email" placeholder="name@example.com" required>
      <label>Password</label><input type="password" id="su-password" placeholder="At least 8 characters" minlength="8" required>
      <label>Confirm Password</label><input type="password" id="su-confirm" placeholder="Confirm Password" minlength="8" required>
      <button type="submit" class="btn btn-primary" id="su-btn" style="margin-top:18px">Create Account</button>
    </form>
    <p class="foot-link">Already have an account? <a class="link" onclick="go('v-login')">Login</a></p>
    <p class="foot-link" style="margin-top:6px">Healthcare professional? <a class="link" onclick="state.role='provider';buildNav();go('v-psignup')">Register as Provider</a></p>
  </div>
</section>

<section class="view" id="v-verify" data-title="Verify Account" data-nav="none">
  <div class="card center">
    <h2 class="title">Verify Your Account</h2>
    <p class="sub">Account verified successfully. Continue to set up your profile.</p>
    <div class="otp-row">
      <input maxlength="1" value="1" oninput="otpNext(this)"><input maxlength="1" value="2" oninput="otpNext(this)">
      <input maxlength="1" value="3" oninput="otpNext(this)"><input maxlength="1" value="4" oninput="otpNext(this)">
    </div>
    <p class="foot-link">Didn't receive a code? <a class="link" onclick="toast('Code resent')">Resend code</a></p>
    <button class="btn btn-primary" onclick="state.profile.name=state.profile.name||'Jenny';go('v-ob1')">Continue to Profile</button>
  </div>
</section>

<section class="view" id="v-login" data-title="Log in" data-nav="none">
  <div class="card">
    <p class="sub" style="margin-bottom:0">Welcome to</p>
    <h2 class="title">MedTrace</h2>
    <p class="sub">Please log in to your patient account to continue</p>
    <form id="login-form" onsubmit="handleLogin(event, 'patient')">
      <label>Email Address</label><input type="email" id="login-email" placeholder="example12@gmail.com" required>
      <label>Password</label><input type="password" id="login-password" placeholder="Input Password" required>
      <p class="foot-link" style="text-align:right;margin:8px 0 0"><a class="link">Forgot Password?</a></p>
      <button type="submit" class="btn btn-primary" id="login-btn" style="margin-top:18px">Login</button>
    </form>
    <p class="foot-link">Don't have an account? <a class="link" onclick="go('v-signup')">Sign up</a></p>
    <p class="foot-link" style="margin-top:6px">Healthcare professional? <a class="link" onclick="state.role='provider';buildNav();go('v-plogin')">Provider Login</a></p>
  </div>
</section>

<!-- ===================== ONBOARDING ===================== -->
<section class="view" id="v-ob1" data-title="About You" data-nav="none">
  <div class="card">
    <p class="step">Step 1 of 4</p>
    <h2 class="title">Tell Us About Yourself</h2>
    <label>Full Name</label><input type="text" id="p-name">
    <label>Date of Birth</label><input type="text" id="p-dob" placeholder="DD / MM / YYYY">
    <label>Blood Group</label>
    <select id="p-blood"><option>Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
    <label>Emergency Contact</label><input type="text" id="p-contact" placeholder="Name and phone number">
    <button class="btn btn-primary" id="ob1-btn" style="margin-top:18px" onclick="saveP1()">Continue</button>
  </div>
</section>

<section class="view" id="v-ob2" data-title="Medical Conditions" data-nav="none">
  <div class="card">
    <p class="step">Step 2 of 4</p>
    <h2 class="title">Medical Conditions &amp; Health Details</h2>
    <p class="sub">Add any medical conditions, allergies, or medications you currently have</p>
    <label>Medical Condition</label>
    <div class="row"><input type="text" id="cond-input" placeholder="e.g. Asthma" onkeydown="if(event.key==='Enter'){event.preventDefault();addCondition();}"><button class="btn btn-outline" id="add-cond-btn" style="width:auto;padding:0 16px" onclick="addCondition()">Add</button></div>
    <div id="cond-list" style="margin-top:12px"></div>
    <label class="checkline"><input type="checkbox" onchange="toggleNone(this,'cond-input',state.conditions,'cond-list')"> I don't have any conditions</label>

    <label style="margin-top:14px">Allergies (optional)</label>
    <div class="row"><input type="text" id="ob-allergy-input" placeholder="e.g. Penicillin - Severe rash" onkeydown="if(event.key==='Enter'){event.preventDefault();addObAllergy();}"><button class="btn btn-outline" id="ob-add-allergy-btn" style="width:auto;padding:0 16px" onclick="addObAllergy()">Add</button></div>
    <div id="ob-allergy-list" style="margin-top:8px"></div>

    <label style="margin-top:14px">Current Medications (optional)</label>
    <div class="row"><input type="text" id="ob-med-input" placeholder="e.g. Albuterol - 90mcg" onkeydown="if(event.key==='Enter'){event.preventDefault();addObMedication();}"><button class="btn btn-outline" id="ob-add-med-btn" style="width:auto;padding:0 16px" onclick="addObMedication()">Add</button></div>
    <div id="ob-med-list" style="margin-top:8px"></div>

    <button class="btn btn-primary" id="ob2-btn" style="margin-top:16px" onclick="saveP2()">Continue</button>
  </div>
</section>

<section class="view" id="v-ob3" data-title="Procedures" data-nav="none">
  <div class="card">
    <p class="step">Step 3 of 4</p>
    <h2 class="title">Previous Procedures</h2>
    <p class="sub">Add any major surgeries or procedures you'd like healthcare providers to know about</p>
    <label>Procedure</label>
    <div class="row"><input type="text" id="proc-input" placeholder="e.g. Appendectomy - 2023" onkeydown="if(event.key==='Enter'){event.preventDefault();addProcedure();}"><button class="btn btn-outline" id="add-proc-btn" style="width:auto;padding:0 16px" onclick="addProcedure()">Add</button></div>
    <div id="proc-list" style="margin-top:12px"></div>
    <p class="sub" id="proc-empty">No procedures added</p>
    <button class="btn btn-primary" id="ob3-btn" style="margin-top:10px" onclick="saveP3()">Continue</button>
  </div>
</section>

<section class="view" id="v-review" data-title="Review" data-nav="none">
  <div class="card">
    <h2 class="title">Review Your Information</h2>
    <p class="sub">Make sure everything is correct before creating your MedTrace passport</p>
    <div id="review-body"></div>
    <button class="btn btn-primary" id="confirm-passport-btn" style="margin-top:10px" onclick="confirmPassport()">Confirm &amp; Create Passport</button>
  </div>
</section>

<section class="view" id="v-created" data-title="Passport Created" data-nav="none">
  <div class="card center">
    <div style="font-size:2.6rem">✅</div>
    <h2 class="title">Your MedTrace QR</h2>
    <p class="sub">Show this code to an authorized healthcare provider to request access to your medical information</p>
    <div class="qr-box" id="created-qr-box" style="padding:0;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;">
      <img id="created-qr-img" alt="MedTrace QR" style="width:100%;height:100%;object-fit:contain;display:none;">
      <span id="created-qr-fallback">Loading QR...</span>
    </div>
    <p class="sub" id="created-passport-id" style="font-weight:700;margin-bottom:14px;color:var(--navy);font-size:1.05rem;"></p>
    <button class="btn btn-primary" onclick="go('v-dash')">Go to Dashboard</button>
    <button class="btn btn-outline" style="margin-top:8px" onclick="lookupEmergency(state.profile.qr_token)">🚨 Preview Emergency Screen</button>
  </div>
</section>

<!-- ===================== PATIENT APP ===================== -->
<section class="view" id="v-dash" data-title="Dashboard" data-nav="dashboard">
  <h2 class="title" id="greetTxt" style="margin-bottom:2px">Good morning, Jenny</h2>
  <p class="sub">Your MedTrace</p>
  <div class="banner">
    <p style="font-weight:700;margin-bottom:14px">Your MedTrace QR</p>
    <div class="qr-box" id="dash-qr-box" style="width:120px;height:120px;padding:0;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;">
      <img id="dash-qr-img" alt="MedTrace QR" style="width:100%;height:100%;object-fit:contain;display:none;">
      <span id="dash-qr-fallback" style="font-size:.65rem">SCAN ME</span>
    </div>
    <p class="sub" id="dash-passport-id" style="color:#fff;font-weight:700;margin:-6px 0 14px;"></p>
    <button class="btn btn-primary" style="width:auto;padding:8px 26px;display:inline-block" onclick="go('v-created')">Show QR</button>
  </div>
  <p class="section-title">Medical Profile</p>
  <div class="grid3">
    <div class="tile" onclick="go('v-profile')">❤️<br><span id="dash-cond-label">Conditions</span></div>
    <div class="tile" onclick="go('v-profile')">⚠️<br><span id="dash-allergies-label">Allergies</span></div>
    <div class="tile" onclick="go('v-profile')">💊<br><span id="dash-meds-label">Medications</span></div>
  </div>
  <p class="section-title">Quick Access</p>
  <div class="qgrid">
    <div class="qcard" onclick="go('v-emerg2')">🚨 Emergency Profile</div>
    <div class="qcard" onclick="go('v-history')">🕘 Access History</div>
  </div>
  <div id="dash-requests-container" style="display:none;margin-top:16px;">
    <p class="section-title" style="color:var(--blue);margin-top:0">Incoming Access Requests</p>
    <div id="dash-requests-list"></div>
  </div>
  <button class="btn btn-outline" id="dash-check-req-btn" style="margin-top:14px;width:100%" onclick="loadAccessRequests(true)">🔄 Check for Access Requests</button>
</section>

<section class="view" id="v-profile" data-title="Medical Profile" data-nav="profile">
  <h2 class="title">My Medical Profile</h2>
  <div class="card" style="margin-top:14px">
    <div style="display:flex;justify-content:space-between"><p class="section-title" style="margin-top:0">Personal Information</p><a class="link" onclick="go('v-ob1')">Edit</a></div>
    <p style="font-size:.88rem;line-height:1.9" id="pi-view"></p>
    <div style="display:flex;justify-content:space-between"><p class="section-title">Medical Conditions</p><a class="link" onclick="go('v-ob2')">Edit</a></div>
    <div id="pf-cond"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <p class="section-title">Allergies</p>
      <a class="link" id="pf-add-allergy-link" style="cursor:pointer" onclick="toggleAddAllergy()">+ Add Allergy</a>
    </div>
    <div id="pf-allergies"></div>
    <!-- Add Allergy inline form -->

<script>
/* ---------------- state & auth ---------------- */
const savedUserStr = localStorage.getItem('medtrace_user');
let savedUser = null;
try { savedUser = savedUserStr ? JSON.parse(savedUserStr) : null; } catch(e) {}
const savedToken = localStorage.getItem('medtrace_token') || null;
const savedPassportId = localStorage.getItem('medtrace_passport_id') || '';

const state = {
  role: (savedUser && savedUser.role) ? savedUser.role : 'patient',
  auth: {
    token: savedToken,
    user: savedUser
  },
  profile:{
    name: (savedUser && savedUser.full_name) ? savedUser.full_name : 'Jenny',
    dob:'',blood:'Select',contact:'',
    passport_id: savedPassportId
  },
  conditions:[], procedures:[], allergies:[], medications:[],
  savedConditions: new Set(),
  savedProcedures: new Set(),
  savedAllergies: new Set(),
  savedMedications: new Set(),
  dashboard: null,
  records: null,
  providerDashboard: null,
  scannedPatient: null,
  accessRequests: [],
  accessHistory: [],
  activeRequestId: null,
  lastSentRequest: null,
  activePatientId: null,
  activePatientName: '',
  providerPatientRecords: null,
  emergencyProfile: null,
  emergencyToken: '',
  history:[
    {org:'XYZ Hospital',doc:'Dr. Ahmed',items:'Conditions, Allergies, Medication',date:'2 days ago'},
    {org:'ABC Hospital',doc:'Dr. Sarah',items:'Conditions, Vitals, Medication',date:'1 week ago'}
  ],
  patients:[
    {name:'John Taylor',scan:'Today, 9:12am'},
    {name:'Maria Lopez',scan:'Yesterday'},
    {name:'Sam Peters',scan:'3 days ago'}
  ],
  backendHealthy: null,
  backendService: null
};
let navStack=[];

/* ---------------- API client ---------------- */
function getApiBaseUrl() {
  if (window.MEDTRACE_API_URL) return window.MEDTRACE_API_URL;
  const stored = localStorage.getItem('medtrace_api_url');
  if (stored) return stored;
  if (window.location.protocol.startsWith('http')) {
    return '';
  }
  return 'http://localhost:3000';
}

const API_BASE_URL = getApiBaseUrl();

async function apiRequest(endpoint, options = {}) {
  const primaryBase = getApiBaseUrl();
  const headers = {
    'Content-Type': 'application/json',
    'Accept': 'application/json',
    ...(options.headers || {})
  };

  const token = state.auth && state.auth.token;
  if (token && !headers['Authorization']) {
    headers['Authorization'] = `Bearer ${token}`;
  }

  async function executeFetch(base) {
    const url = endpoint.startsWith('http') ? endpoint : `${base}${endpoint}`;
    const res = await fetch(url, {
      ...options,
      headers
    });
    let data = null;
    let text = '';
    const contentType = res.headers.get('content-type') || '';
    if (contentType.includes('application/json')) {
      try {
        data = await res.json();
      } catch (e) {
        data = null;
      }
    } else {
      try {
        text = await res.text();
      } catch (e) {}
    }
    return { res, data, text };
  }

  let attempt;
  try {
    attempt = await executeFetch(primaryBase);
    // If dev server returned HTML 404 because proxy was not reached, attempt alternate port fallback
    if (attempt.res.status === 404 && attempt.text && attempt.text.includes('<html') && !endpoint.startsWith('http')) {
      const fallbackBase = primaryBase === '' ? 'http://localhost:8080' : (primaryBase === 'http://localhost:3000' ? 'http://localhost:8080' : 'http://localhost:3000');
      try {
        const fallbackAttempt = await executeFetch(fallbackBase);
        if (fallbackAttempt.res.ok || (fallbackAttempt.data && fallbackAttempt.data.detail)) {
          attempt = fallbackAttempt;
        }
      } catch (fbErr) {}
    }
  } catch (err) {
    if (!endpoint.startsWith('http')) {
      const fallbackBase = primaryBase === 'http://localhost:3000' ? 'http://localhost:8080' : 'http://localhost:3000';
      try {
        attempt = await executeFetch(fallbackBase);
      } catch (fbErr) {
        throw new Error('Network error. Unable to reach backend server. Please verify your connection or dev server.');
      }
    } else {
      throw new Error('Network error. Unable to reach backend server. Please verify your connection or dev server.');
    }
  }

  const { res: response, data, text } = attempt;

  if (!response.ok) {
    let errorMsg = `Request failed (${response.status})`;
    if (data && data.detail) {
      if (typeof data.detail === 'string') {
        errorMsg = data.detail;
      } else if (Array.isArray(data.detail)) {
        errorMsg = data.detail.map(d => (d.msg || d.message || JSON.stringify(d))).join(', ');
      }
    } else if (text && text.length < 120 && !text.includes('<html')) {
      errorMsg = text;
    } else if (response.status === 401) {
      errorMsg = 'Incorrect email or password.';
    } else if (response.status === 404) {
      if (endpoint.includes('/patients/lookup/')) {
        errorMsg = 'Patient QR code was not found.';
      } else {
        errorMsg = 'Requested endpoint was not found (404). Please ensure the backend is running.';
      }
    } else if (response.status === 409) {
      errorMsg = 'This email is already registered.';
    } else if (response.status === 422) {
      errorMsg = 'Validation error. Please verify your input.';
    }
    const error = new Error(errorMsg);
    error.status = response.status;
    error.data = data;
    throw error;
  }

  return data;
}

async function handleSignup(event, formRole = 'patient') {
  event.preventDefault();
  const isProvider = formRole === 'provider';

  const nameId = isProvider ? 'psu-name' : 'su-name';
  const emailId = isProvider ? 'psu-email' : 'su-email';
  const passId = isProvider ? 'psu-password' : 'su-password';
  const confirmId = isProvider ? 'psu-confirm' : 'su-confirm';
  const btnId = isProvider ? 'psu-btn' : 'su-btn';

  const nameInput = document.getElementById(nameId);
  const emailInput = document.getElementById(emailId);
  const passwordInput = document.getElementById(passId);
  const confirmInput = document.getElementById(confirmId);
  const btn = document.getElementById(btnId);

  const fullName = nameInput ? nameInput.value.trim() : '';
  const email = emailInput ? emailInput.value.trim().toLowerCase() : '';
  const password = passwordInput ? passwordInput.value : '';
  const confirmPassword = confirmInput ? confirmInput.value : '';

  if (fullName.length < 2) {
    toast('Full name must be at least 2 characters');
    return;
  }
  if (!email || !email.includes('@')) {
    toast('Please enter a valid email address');
    return;
  }
  if (password.length < 8) {
    toast('Password must be at least 8 characters');
    return;
  }
  if (password !== confirmPassword) {
    toast('Passwords do not match');
    return;
  }

  const payload = {
    full_name: fullName,
    email: email,
    password: password,
    role: isProvider ? 'provider' : 'patient'
  };

  if (isProvider) {
    const orgInput = document.getElementById('psu-org');
    const org = orgInput ? orgInput.value.trim() : '';
    if (!org) {
      toast('Please enter your hospital or clinic name');
      return;
    }
    payload.organization = org;
  }

  const originalText = btn ? btn.textContent : 'Create Account';
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Creating account...';
  }

  try {
    const data = await apiRequest('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    setAuthSession(data.access_token, data.user);
    if (isProvider) {
      state.role = 'provider';
      buildNav();
      toast(`Welcome, ${data.user.full_name}! Provider account created.`);
      loadProviderDashboard();
      go('v-pdash', true);
    } else {
      state.role = 'patient';
      buildNav();
      toast('Account created successfully!');
      go('v-verify');
    }
  } catch (err) {
    toast(err.message || 'Registration failed');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
}

function buildNav(){
  const isAuth = Boolean(state.auth && state.auth.token);
  const items = state.role==='patient'?PATIENT_NAV:PROVIDER_NAV;
  const roleEl = document.getElementById('roleLabel');
  if (roleEl) {
    if (isAuth && state.auth.user) {
      roleEl.textContent = `${state.role === 'patient' ? 'Patient' : 'Provider'}: ${state.auth.user.full_name}`;
    } else {
      roleEl.textContent = state.role === 'patient' ? 'Patient Portal' : 'Provider Portal';
    }
  }

  const switchBtn = document.getElementById('switchRoleBtn');
  if (switchBtn) {
    const target = state.role === 'patient' ? 'Provider' : 'Patient';
    switchBtn.textContent = isAuth ? `Switch to ${target} Portal (Log out)` : `Switch to ${target} Portal`;
  }

  let navHtml = items.map(i=>`<a onclick="handleNavClick('${i[0]}')" data-target="${i[0]}"><span>${i[1]}</span>${i[2]}</a>`).join('');
  if (isAuth) {
    navHtml += `<a onclick="logout()" style="color:#ef4444;margin-top:14px;cursor:pointer"><span>🚪</span>Log out</a>`;
  }
  document.getElementById('sidebarNav').innerHTML = navHtml;
  document.getElementById('bottomnav').innerHTML = items.map(i=>`<a onclick="handleNavClick('${i[0]}')" data-target="${i[0]}"><span>${i[1]}</span>${i[2]}</a>`).join('');
}

function handleNavClick(id) {
  if (!state.auth || !state.auth.token) {
    toast('Please log in to access this section');
    go(state.role === 'provider' ? 'v-plogin' : 'v-login');
    return;
  }
  go(id);
}

function switchRole(){
  const targetRole = state.role === 'patient' ? 'provider' : 'patient';
  if (state.auth && state.auth.token) {
    if (cachedQrBlobUrl) {
      try { URL.revokeObjectURL(cachedQrBlobUrl); } catch(e) {}
      cachedQrBlobUrl = null;
    }
    state.auth = { token: null, user: null };
    state.profile.passport_id = '';
    state.dashboard = null;
    state.records = null;
    state.providerDashboard = null;
    state.scannedPatient = null;
    localStorage.removeItem('medtrace_token');
    localStorage.removeItem('medtrace_user');
    localStorage.removeItem('medtrace_passport_id');
    toast(`Switched to ${targetRole === 'provider' ? 'Healthcare Provider' : 'Patient'} portal`);
  }
  state.role = targetRole;
  buildNav();
  go(targetRole === 'patient' ? 'v-welcome' : 'v-plogin', true);
}

function highlightNav(id){
  document.querySelectorAll('#sidebarNav a,#bottomnav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.target===id);
  });
}

function go(id, reset){
  if(reset) navStack=[];
  const cur = document.querySelector('.view.active');
  if(cur && cur.id!==id) navStack.push(cur.id);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById(id);
  el.classList.add('active');
  document.getElementById('topTitle').textContent = el.dataset.title;
  document.getElementById('backBtn').style.visibility = navStack.length?'visible':'hidden';
  highlightNav(id);
  renderDynamic(id);
  window.scrollTo(0,0);
}
function goBack(){ if(navStack.length){ const id=navStack.pop(); document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); const el=document.getElementById(id); el.classList.add('active'); document.getElementById('topTitle').textContent=el.dataset.title; document.getElementById('backBtn').style.visibility=navStack.length?'visible':'hidden'; highlightNav(id); renderDynamic(id);} }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

let cachedQrBlobUrl = null;

async function loadPatientQrImage() {
  if (!state.auth || !state.auth.token || state.role !== 'patient') return null;
  if (cachedQrBlobUrl) {
    applyQrImage(cachedQrBlobUrl);
    return cachedQrBlobUrl;
  }
  const token = state.auth.token;
  async function fetchQr(base) {
    const url = `${base}/api/patient/qr.png`;
    const res = await fetch(url, {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    if (!res.ok) throw new Error('Failed to load QR image: ' + res.status);
    return await res.blob();
  }

  let blob = null;
  const primaryBase = getApiBaseUrl();
  try {
    blob = await fetchQr(primaryBase);
  } catch (err) {
    try {
      const fallbackBase = primaryBase === '' ? 'http://localhost:8080' : (primaryBase === 'http://localhost:3000' ? 'http://localhost:8080' : 'http://localhost:3000');
      blob = await fetchQr(fallbackBase);
    } catch (fbErr) {
      console.error('QR load error:', err, fbErr);
      return null;
    }
  }

  if (blob) {
    cachedQrBlobUrl = URL.createObjectURL(blob);
    applyQrImage(cachedQrBlobUrl);
    return cachedQrBlobUrl;
  }
  return null;
}

function applyQrImage(url) {
  const createdImg = document.getElementById('created-qr-img');
  const createdFallback = document.getElementById('created-qr-fallback');
  if (createdImg) {
    createdImg.src = url;
    createdImg.style.display = 'block';
    if (createdFallback) createdFallback.style.display = 'none';
  }

  const dashImg = document.getElementById('dash-qr-img');
  const dashFallback = document.getElementById('dash-qr-fallback');
  if (dashImg) {
    dashImg.src = url;
    dashImg.style.display = 'block';
    if (dashFallback) dashFallback.style.display = 'none';
  }
}

/* ---- Group 5: Consent / Access Request Workflow ---- */
async function submitAccessRequest() {
  if (!state.auth || !state.auth.token || state.role !== 'provider') {
    toast('Must be logged in as a healthcare provider to request access');
    return;
  }

  const token = (state.scannedPatient && state.scannedPatient.qr_token) 
    || localStorage.getItem('medtrace_last_qr_token');

  if (!token) {
    toast('No scanned patient QR token found. Please scan patient first.');
    go('v-scan');
    return;
  }

  const reasonEl = document.getElementById('preq-reason');
  const reason = reasonEl ? reasonEl.value : 'Consultation';

  const btn = document.getElementById('preq-btn');
  const originalText = btn ? btn.textContent : 'Send Request';
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Sending Request...';
  }

  try {
    const data = await apiRequest('/api/access/requests', {
      method: 'POST',
      body: JSON.stringify({
        qr_token: token,
        reason: reason
      })
    });
    if (data) {
      state.lastSentRequest = data;
      const patientName = (state.scannedPatient && state.scannedPatient.patient_name) || data.patient_name || 'Patient';
      const psentSub = document.getElementById('psent-sub');
      if (psentSub) {
        psentSub.textContent = `${patientName} has been notified. You will be able to view their medical information once access is granted.`;
      }
      toast(`✓ Access request sent to ${patientName}`);
      loadProviderDashboard();
      go('v-psent');
    }
  } catch (err) {
    toast(err.message || 'Failed to submit access request');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
}

async function loadAccessRequests(showToast = false) {
  if (!state.auth || !state.auth.token) return [];
  try {
    const data = await apiRequest('/api/access/requests');
    if (Array.isArray(data)) {
      state.accessRequests = data;
      renderAccessRequestsUI(data);
      if (showToast) {
        const pendingCount = data.filter(r => r.status === 'pending').length;
        toast(`Checked requests: ${pendingCount} pending`);
      }
    }
    return data;
  } catch (err) {
    console.error('Failed to load access requests:', err);
    if (showToast) toast(err.message || 'Failed to check access requests');
    return [];
  }
}

function renderAccessRequestsUI(requests = state.accessRequests) {
  const reqList = Array.isArray(requests) ? requests : [];
  const pendingRequests = reqList.filter(r => r.status === 'pending');
  const decidedRequests = reqList.filter(r => r.status !== 'pending');

  // 1. Dashboard Pending Requests Widget
  const dashContainer = document.getElementById('dash-requests-container');
  const dashList = document.getElementById('dash-requests-list');
  if (dashContainer && dashList) {
    if (pendingRequests.length > 0) {
      dashContainer.style.display = 'block';
      dashList.innerHTML = pendingRequests.map(r => `
        <div class="card" style="margin-bottom:12px;border:1.5px solid var(--blue);background:var(--blue-l);padding:14px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <b style="color:var(--navy);font-size:.95rem">${r.provider_name || 'Healthcare Provider'}</b><br>
              <span class="sub" style="margin:2px 0 6px;display:block;color:var(--gray)">Reason: ${r.reason || 'Consultation'} &middot; ${new Date(r.created_at).toLocaleDateString()}</span>
            </div>
            <span class="badge warn">Pending</span>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="btn btn-outline" style="background:#fff;padding:8px" onclick="respondRequest(${r.id}, false)">Reject</button>
            <button class="btn btn-primary" style="padding:8px" onclick="respondRequest(${r.id}, true)">Approve Access</button>
          </div>
        </div>
      `).join('');
    } else {
      dashContainer.style.display = 'none';
      dashList.innerHTML = '';
    }
  }

  // 2. Dedicated Request View (v-request)
  const reqCard = document.getElementById('req-card-content');
  const reqEmpty = document.getElementById('req-empty');
  if (reqCard && reqEmpty) {
    let activeReq = null;
    if (state.activeRequestId) {
      activeReq = pendingRequests.find(r => r.id === state.activeRequestId);
    }
    if (!activeReq && pendingRequests.length > 0) {
      activeReq = pendingRequests[0];
      state.activeRequestId = activeReq.id;
    }

    if (activeReq) {
      reqCard.style.display = 'block';
      reqEmpty.style.display = 'none';

      const avatarEl = document.getElementById('req-avatar');
      if (avatarEl) {
        const initials = (activeReq.provider_name || 'HP').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        avatarEl.textContent = initials || 'HP';
      }
      const provNameEl = document.getElementById('req-provider-name');
      if (provNameEl) provNameEl.textContent = activeReq.provider_name || 'Healthcare Provider';

      const provOrgEl = document.getElementById('req-provider-org');
      if (provOrgEl) provOrgEl.textContent = activeReq.reason ? `Reason: ${activeReq.reason}` : 'Healthcare Consultation';

      const reasonText = document.getElementById('req-reason-text');
      if (reasonText) {
        reasonText.textContent = `${activeReq.provider_name || 'A provider'} is requesting access to your medical information for ${activeReq.reason || 'consultation'}.`;
      }

      const approveBtn = document.getElementById('req-approve-btn');
      if (approveBtn) approveBtn.setAttribute('onclick', `respondRequest(${activeReq.id}, true)`);
      const rejectBtn = document.getElementById('req-reject-btn');
      if (rejectBtn) rejectBtn.setAttribute('onclick', `respondRequest(${activeReq.id}, false)`);
    } else {
      reqCard.style.display = 'none';
      reqEmpty.style.display = 'block';
    }
  }

  // 3. Consent Requests History (v-history)
  const consentHistList = document.getElementById('consent-history-list');
  if (consentHistList) {
    if (decidedRequests.length > 0) {
      consentHistList.innerHTML = decidedRequests.map(h => `
        <div class="list-item">
          <div>
            <b>${h.provider_name || 'Healthcare Provider'}</b><br>
            <span class="sub" style="margin:0">${h.reason || 'Consultation'} &middot; ${new Date(h.decided_at || h.created_at).toLocaleDateString()}</span>
          </div>
          <span class="badge ${h.status === 'approved' ? 'ok' : 'warn'}">${h.status === 'approved' ? 'Approved' : 'Rejected'}</span>
        </div>
      `).join('');
    } else {
      consentHistList.innerHTML = '<p class="sub" style="margin:10px 0">No past consent decisions recorded yet.</p>';
    }
  }
}

async function respondRequest(requestId, approved) {
  if (!requestId) {
    const pending = (state.accessRequests || []).find(r => r.status === 'pending');
    if (pending) requestId = pending.id;
  }
  if (!requestId) {
    toast('No pending request selected');
    return;
  }

  // Prevent duplicate submissions
  const allBtns = document.querySelectorAll(`button[onclick*="respondRequest"]`);
  allBtns.forEach(b => {
    b.disabled = true;
    b.dataset.prevText = b.textContent;
    b.textContent = 'Updating...';
  });

  try {
    const updated = await apiRequest(`/api/access/requests/${requestId}`, {
      method: 'PATCH',
      body: JSON.stringify({ approved })
    });
    if (updated) {
      toast(approved ? '✓ Access request approved' : 'Access request rejected');
      if (Array.isArray(state.accessRequests)) {
        const idx = state.accessRequests.findIndex(r => r.id === requestId);
        if (idx !== -1) {
          state.accessRequests[idx] = updated;
        } else {
          state.accessRequests.unshift(updated);
        }
      }
      state.activeRequestId = null;
      renderAccessRequestsUI(state.accessRequests);
      await loadAccessRequests();
      go('v-dash');
    }
  } catch (err) {
    toast(err.message || 'Failed to update request');
  } finally {
    allBtns.forEach(b => {
      b.disabled = false;
      if (b.dataset.prevText) b.textContent = b.dataset.prevText;
    });
  }
}

function respondActiveRequest(approved) {
  const reqId = state.activeRequestId || ((state.accessRequests || []).find(r => r.status === 'pending') || {}).id;
  respondRequest(reqId, approved);
}

function formatAccessType(type) {
  if (!type) return 'Record Access';
  if (type === 'full_record') return 'Full Medical Records Access';
  if (type === 'emergency') return 'Emergency Medical Access';
  if (type === 'summary') return 'Summary Information Access';
  return type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}

function renderAccessHistoryUI(data) {
  const histList = document.getElementById('history-list');
  if (!histList) return;

  const logs = Array.isArray(data) ? data : (state.accessHistory || []);

  if (logs.length === 0) {
    histList.innerHTML = '<p class="sub" style="margin:10px 0">No access history recorded yet. When healthcare providers access your records, it will be logged here in real time.</p>';
    return;
  }

  histList.innerHTML = logs.map(h => {
    const provider = h.provider_name || 'Healthcare Provider';
    const accessDesc = formatAccessType(h.access_type);
    let dateStr = 'Recently';
    if (h.created_at) {
      try {
        const d = new Date(h.created_at);
        dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) {
        dateStr = h.created_at;
      }
    }
    const isEmergency = (h.access_type || '').toLowerCase() === 'emergency';
    const badgeClass = isEmergency ? 'warn' : 'ok';
    const badgeText = isEmergency ? 'Emergency' : 'Accessed';

    return `
      <div class="list-item">
        <div>
          <b>${provider}</b><br>
          <span class="sub" style="margin:0">${accessDesc} &middot; ${dateStr}</span>
        </div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
    `;
  }).join('');
}

/* ---- Group 8: Emergency QR Access ---- */
async function fetchEmergencyProfile(qrToken) {
  if (!qrToken) {
    throw new Error('Missing emergency QR token');
  }

  const primaryBase = getApiBaseUrl();
  const url = `${primaryBase}/api/emergency/${encodeURIComponent(qrToken)}`;

  // CRITICAL SECURITY REQUIREMENT:
  // Intentionally unauthenticated request: DO NOT attach Authorization header or JWT
  const res = await fetch(url, {
    method: 'GET',
    headers: {
      'Accept': 'application/json'
    }
  });

  if (!res.ok) {
    let errMsg = `Emergency lookup failed (${res.status})`;
    try {
      const errJson = await res.json();
      if (errJson && errJson.detail) errMsg = errJson.detail;
    } catch (e) {}
    throw new Error(errMsg);
  }

  return await res.json();
}

async function lookupEmergency(customToken) {
  const inp = document.getElementById('emerg-token-input');
  let token = customToken || (inp ? inp.value.trim() : '');

  if (!token) {
    token = state.emergencyToken || (state.scannedPatient ? state.scannedPatient.qr_token : '') || (state.profile ? state.profile.qr_token : '') || localStorage.getItem('medtrace_last_qr_token') || '';
  }

  if (!token) {
    toast('Please enter or scan a valid QR token');
    go('v-emerg-scan');
    return;
  }

  state.emergencyToken = token;
  go('v-emerg-info');
  setEmergencyLoading(true);

  try {
    const data = await fetchEmergencyProfile(token);
    state.emergencyProfile = data;
    renderEmergencyInfoUI(data);
    setEmergencyLoading(false);
    toast(`✓ Emergency profile retrieved: ${data.patient_name || 'Patient'}`);
  } catch (err) {
    console.error('Emergency lookup error:', err);
    setEmergencyLoading(false);
    renderEmergencyError(err.message || 'Emergency record not found');
  }
}

function simulateEmergencyScan() {
  const token = (state.scannedPatient && state.scannedPatient.qr_token)
    || (state.profile && state.profile.qr_token)
    || localStorage.getItem('medtrace_last_qr_token');

  if (!token) {
    toast('No saved QR token found to simulate. Please paste a token.');
    return;
  }
  const inp = document.getElementById('emerg-token-input');
  if (inp) inp.value = token;
  lookupEmergency(token);
}

function exitEmergencyFlow() {
  if (state.auth && state.auth.token) {
    if (state.role === 'provider') {
      go('v-pdash');
    } else {
      go('v-dash');
    }
  } else {
    go('v-welcome', true);
  }
}

async function saveP1(){
  const nameEl = document.getElementById('p-name');
  const dobEl = document.getElementById('p-dob');
  const bloodEl = document.getElementById('p-blood');
  const contactEl = document.getElementById('p-contact');
  const btn = document.getElementById('ob1-btn');

  const fullName = nameEl ? nameEl.value.trim() : '';
  const dob = dobEl ? dobEl.value.trim() : '';
  const blood = bloodEl ? bloodEl.value : '';
  const contact = contactEl ? contactEl.value.trim() : '';

  let contactName = contact || null;
  let contactPhone = null;
  if (contact) {
    const parts = contact.split(/[-–,]/);
    if (parts.length > 1) {
      contactName = parts[0].trim();
      contactPhone = parts.slice(1).join('-').trim();
    } else {
      const match = contact.match(/^(.*?)([\+\d\s\(\)\-]{7,})$/);
      if (match) {
        contactName = match[1].trim() || contact;
        contactPhone = match[2].trim();
      }
    }
  }

  const payload = {
    date_of_birth: dob || null,
    blood_group: (blood && blood !== 'Select') ? blood : null,
    emergency_contact_name: contactName,
    emergency_contact_phone: contactPhone
  };

  const originalText = btn ? btn.textContent : 'Continue';
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Saving...';
  }

  try {
    const updated = await apiRequest('/api/patient/profile', {
      method: 'PATCH',
      body: JSON.stringify(payload)
    });
    if (fullName) state.profile.name = fullName;
    state.profile.dob = updated.date_of_birth || dob;
    state.profile.blood = updated.blood_group || blood;
    state.profile.contact = contact;
    if (updated.emergency_contact_name) state.profile.emergency_contact_name = updated.emergency_contact_name;
    if (updated.emergency_contact_phone) state.profile.emergency_contact_phone = updated.emergency_contact_phone;
    if (updated.passport_id) {
      state.profile.passport_id = updated.passport_id;
      localStorage.setItem('medtrace_passport_id', updated.passport_id);
    }
    if (updated.qr_token) state.profile.qr_token = updated.qr_token;
    toast('✓ Personal details saved');
    go('v-ob2');
  } catch (err) {
    toast(err.message || 'Failed to save profile');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }
}

async function submitAddAllergy() {
  const nameInp = document.getElementById('new-allergy-name');
  const reactInp = document.getElementById('new-allergy-reaction');
  const btn = document.getElementById('save-allergy-btn');
  const errEl = document.getElementById('allergy-form-error');

  const name = nameInp ? nameInp.value.trim() : '';
  const reaction = reactInp ? reactInp.value.trim() : '';

  if (!name) {
    if (errEl) {
      errEl.textContent = 'Please enter an allergy or allergen name.';
      errEl.style.display = 'block';
    }
    if (nameInp) nameInp.focus();
    return;
  }
  if (errEl) errEl.style.display = 'none';

  // Prevent duplicate submissions while request is pending
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Saving...';
  }

  try {
    const created = await apiRequest('/api/patient/allergies', {
      method: 'POST',
      body: JSON.stringify({
        name: name,
        reaction: reaction || null
      })
    });

    const item = created || { name, reaction };

    if (reactInp) reactInp.value = '';

    loadPatientRecords();

    if (errEl) {
      errEl.textContent = err.message || 'Failed to add allergy. Please try again.';
      errEl.style.display = 'block';

function addChip(inputId,listId,arr){

function renderChips(listId,arr){
  document.getElementById(listId).innerHTML = arr.map((c,i)=>`<span class="chip">${c}<button onclick="arr_remove('${listId}',${i})">&times;</button></span>`).join('');
  const empty=document.getElementById('proc-empty'); if(empty) empty.style.display = state.procedures.length?'none':'block';
}
function arr_remove(listId,i){
  const arr = listId==='cond-list'?state.conditions:state.procedures;
  arr.splice(i,1); renderChips(listId,arr);
}
function toggleNone(cb,inputId,arr,listId){
  document.getElementById(inputId).disabled=cb.checked;
  if(cb.checked){ arr.length=0; renderChips(listId,arr); }
}

function renderDynamic(id){
  if(id==='v-ob1'){
    const pName = document.getElementById('p-name');
    if(pName && !pName.value){ pName.value = state.profile.name || ''; }
    const pDob = document.getElementById('p-dob');
    if(pDob && !pDob.value && state.profile.dob){ pDob.value = state.profile.dob; }
    const pBlood = document.getElementById('p-blood');
    if(pBlood && state.profile.blood && state.profile.blood !== 'Select'){ pBlood.value = state.profile.blood; }
    const pContact = document.getElementById('p-contact');
    if(pContact && !pContact.value && state.profile.contact){ pContact.value = state.profile.contact; }
  }
  if(id==='v-review'){
    const allergiesText = (state.allergies && state.allergies.length)
      ? state.allergies.map(a => `${a.name || a.allergen || 'Allergy'}${a.reaction ? ' (' + a.reaction + ')' : ''}`).join(', ')
      : 'None reported';
    const medsText = (state.medications && state.medications.length)
      ? state.medications.map(m => `${m.name || 'Medication'}${m.dosage ? ' - ' + m.dosage : ''}${m.frequency ? ' (' + m.frequency + ')' : ''}`).join(', ')
      : 'None reported';

    document.getElementById('review-body').innerHTML = `
      <p class="section-title" style="margin-top:0">Personal Information</p>
      <p style="font-size:.88rem">Name: ${state.profile.name||'—'}<br>DOB: ${state.profile.dob||'—'}<br>Blood group: ${state.profile.blood||'—'}</p>
      <p class="section-title">Medical Conditions</p>
      <p style="font-size:.88rem">${state.conditions.join(', ')||'None reported'}</p>
      <p class="section-title">Allergies</p>
      <p style="font-size:.88rem">${allergiesText}</p>
      <p class="section-title">Current Medications</p>
      <p style="font-size:.88rem">${medsText}</p>
      <p class="section-title">Previous Procedures</p>
      <p style="font-size:.88rem">${state.procedures.join(', ')||'None added'}</p>
      <p class="section-title">Emergency Contact</p>
      <p style="font-size:.88rem">${state.profile.contact||'—'}</p>`;
  }
  if(id==='v-created'){
    const passEl = document.getElementById('created-passport-id');
    const pid = state.profile.passport_id || localStorage.getItem('medtrace_passport_id');
    if(passEl){
      if(pid){
        passEl.textContent = 'Passport ID: ' + pid;
      } else {
        passEl.textContent = 'Loading Passport ID...';
        loadPatientDashboard().then(d => {
          if (passEl && d && d.profile && d.profile.passport_id) {
            passEl.textContent = 'Passport ID: ' + d.profile.passport_id;
          }
        });
      }
    }
    loadPatientQrImage();
  }
  if(id==='v-dash'){
    renderDashboardUI(state.dashboard);
    if(!state.dashboard) {
      loadPatientDashboard();
    }
    loadPatientQrImage();
    if (state.role === 'patient') {
      renderAccessRequestsUI(state.accessRequests);
      loadAccessRequests();
    }
  }
  if(id==='v-request'){
    renderAccessRequestsUI(state.accessRequests);
    if (!state.accessRequests || state.accessRequests.length === 0) {
      loadAccessRequests();
    }
  }
  if(id==='v-profile'){
    renderRecordsUI(state.records);
    if(!state.records) {
      loadPatientRecords();
    }
  }
  if(id==='v-emerg2'){
    renderRecordsUI(state.records);
    if(!state.records) {
      loadPatientRecords();
    }
  }
  if(id==='v-history'){
    renderAccessHistoryUI(state.accessHistory);
    loadPatientAccessHistory();
    renderAccessRequestsUI(state.accessRequests);
    loadAccessRequests();
  }
  if(id==='v-pdash'){
    renderProviderDashboardUI(state.providerDashboard);
    if (!state.providerDashboard) {
      loadProviderDashboard();
    }
  }
  if(id==='v-scan'){
    const inp = document.getElementById('scan-qr-token-input');
    const lastToken = localStorage.getItem('medtrace_last_qr_token') || state.profile.qr_token;
    if(inp && !inp.value && lastToken){
      inp.value = lastToken;
    }
  }
  if(id==='v-pfound'){
    renderScannedPatientUI(state.scannedPatient);
  }
  if(id==='v-preq'){
    const sub = document.getElementById('preq-patient-sub');
    if (sub && state.scannedPatient) {
      sub.textContent = `Requesting consultation access for: ${state.scannedPatient.patient_name || 'Patient'}`;
    }
  }
  if(id==='v-pinfo'){
    const pid = state.activePatientId || (state.scannedPatient ? state.scannedPatient.patient_id : null);
    if (pid) {
      if (state.providerPatientRecords) {
        renderProviderPatientRecordsUI(state.providerPatientRecords, state.activePatientName);
      } else {
        loadProviderPatientRecords(pid, state.activePatientName);
      }
    }
  }
  if(id==='v-emerg-scan'){
    const inp = document.getElementById('emerg-token-input');
    const lastToken = localStorage.getItem('medtrace_last_qr_token') || (state.profile ? state.profile.qr_token : '');
    if(inp && !inp.value && lastToken){
      inp.value = lastToken;
    }
  }
  if(id==='v-emerg-info'){
    if (state.emergencyProfile) {
      renderEmergencyInfoUI(state.emergencyProfile);
    } else if (state.emergencyToken) {
      lookupEmergency(state.emergencyToken);
    }
  }
}

/* ---- Group 12: Backend Health Check ---- */
let backendHealthChecked = false;

async function checkBackendHealth() {
  if (backendHealthChecked) return;
  backendHealthChecked = true;

  updateBackendStatusUI('checking');
  try {
    const data = await apiRequest('/health');
    if (data && data.status === 'ok') {
      state.backendHealthy = true;
      state.backendService = data.service || 'medtrace-api';
      updateBackendStatusUI('healthy');
    } else {
      state.backendHealthy = false;
      updateBackendStatusUI('unhealthy');
    }
  } catch (err) {
    console.warn('Backend connectivity note:', err.message || err);
    state.backendHealthy = false;
    updateBackendStatusUI('unhealthy');
  }
}

function updateBackendStatusUI(status) {
  const dot = document.getElementById('backend-status-dot');
  const txt = document.getElementById('backend-status-text');
  const topDot = document.getElementById('topbar-status-dot');

  if (status === 'healthy') {
    if (dot) {
      dot.style.background = '#10b981';
      dot.title = `Connected to ${state.backendService || 'backend'}`;
    }
    if (txt) {
      txt.textContent = 'Connected';
      txt.style.color = '#10b981';
      txt.title = `Connected to ${state.backendService || 'backend'}`;
    }
    if (topDot) {
      topDot.style.background = '#10b981';
      topDot.title = `Connected to ${state.backendService || 'backend'}`;
    }
  } else if (status === 'checking') {
    if (dot) {
      dot.style.background = '#94a3b8';
      dot.title = 'Connecting to backend...';
    }
    if (txt) {
      txt.textContent = 'Connecting...';
      txt.style.color = 'var(--gray)';
    }
    if (topDot) {
      topDot.style.background = '#94a3b8';
      topDot.title = 'Connecting to backend...';
    }
  } else {
    if (dot) {
      dot.style.background = '#f59e0b';
      dot.title = 'Backend offline or unreachable';
    }
    if (txt) {
      txt.textContent = 'Offline';
      txt.style.color = '#f59e0b';
      txt.title = 'Backend offline or unreachable';
    }
    if (topDot) {
      topDot.style.background = '#f59e0b';
      topDot.title = 'Backend offline or unreachable';
    }
  }
}

/* ---- boot ---- */
document.getElementById('viewport').appendChild(document.getElementById('tpl-views').content.cloneNode(true));
buildNav();

// Group 12: Lightweight, non-blocking backend connectivity check
checkBackendHealth();

/* Check for direct emergency lookup via URL parameter or hash */
const urlParams = new URLSearchParams(window.location.search);
const hash = window.location.hash || '';
let emergencyToken = urlParams.get('emergency') || urlParams.get('qr_token');
if (!emergencyToken && hash.includes('emergency/')) {
  emergencyToken = hash.split('emergency/')[1].split('?')[0].trim();
} else if (!emergencyToken && hash.includes('emergency=')) {
  emergencyToken = hash.split('emergency=')[1].split('&')[0].trim();
}

if (emergencyToken) {
  // CRITICAL: Unauthenticated Emergency Flow directly accessible without login
  lookupEmergency(emergencyToken);
} else if (state.auth && state.auth.token) {
  if (state.role === 'patient') {
    loadPatientDashboard();
    loadPatientRecords();
    loadPatientQrImage();
    loadAccessRequests();
    loadPatientAccessHistory();
  } else if (state.role === 'provider') {
    loadProviderDashboard();
  }
  go(state.role === 'provider' ? 'v-pdash' : 'v-dash', true);
} else {
  go('v-welcome', true);
}
</script>
