<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Previous Procedures</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* iPhone Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #f8fafc;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 28px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      z-index: 5;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-signal { width: 14px; height: 10px; fill: #000000; }
    .icon-wifi { width: 13px; height: 10px; fill: #000000; }
    .icon-battery {
      width: 20px;
      height: 10px;
      border: 1px solid #000000;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }
    .icon-battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 100%;
      height: 100%;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 30px 20px;
    }

    /* Floating Card */
    .form-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Stepper Header */
    .stepper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 600;
      background-color: #e2e8f0;
      color: #64748b;
    }

    .step-circle.completed {
      background-color: #e2e8f0;
      color: #64748b;
    }

    .step-circle.active {
      background-color: #64748b;
      color: #ffffff;
    }

    .step-indicator {
      text-align: center;
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .card-title {
      color: #0c2340;
      font-weight: 800;
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .card-subtitle {
      text-align: center;
      font-size: 0.72rem;
      color: #64748b;
      font-weight: 500;
      line-height: 1.35;
      margin-bottom: 24px;
    }

    /* Empty State Box */
    .empty-state-box {
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      background-color: #ffffff;
      margin-bottom: 20px;
    }

    .empty-state-text {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .btn-add-procedure {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      height: 38px;
      background-color: #64748b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* Submit Button */
    .btn-continue {
      display: block;
      width: 100%;
      background-color: #1976d2;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 13px 0;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: auto;
    }

    /* Home Indicator Notch */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  
    /* Full web app layout: reuse each original screen design without a device frame. */
    html { min-height: 100%; }
    body {
      display: block;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0;
      background: #f4f7fb;
      align-items: initial;
      justify-content: initial;
    }
    .phone-mockup {
      width: 100%;
      max-width: 1440px;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
      position: relative;
    }
    .notch, .status-bar, .home-indicator { display: none !important; }
    .app-content {
      width: 100%;
      min-height: calc(100vh - 64px);
      min-height: calc(100dvh - 64px);
      height: auto;
      flex: 1 0 auto;
      overflow: visible;
      padding: clamp(24px, 4vw, 56px) clamp(20px, 6vw, 88px) 32px;
      overscroll-behavior: auto;
    }
    .navbar {
      position: sticky;
      bottom: 0;
      z-index: 20;
      width: 100%;
      min-height: 64px;
      height: auto;
      padding: 12px 20px;
      border-top: 1px solid #e5eaf1;
      background: #ffffff;
    }
    img, svg, video, canvas { max-width: 100%; }
    input, select, textarea, button { max-width: 100%; }
    @media (min-width: 900px) {
      .app-content { padding-left: clamp(48px, 8vw, 112px); padding-right: clamp(48px, 8vw, 112px); }
    }
    /* DESKTOP-FIT-RULES */
    @media (min-width: 900px) {
      .app-content {
        min-height: calc(100vh - 136px);
        min-height: calc(100dvh - 136px);
        padding-left: clamp(48px, 7vw, 112px);
        padding-right: clamp(48px, 7vw, 112px);
      }
      .page-title, .app-title, .form-title, .main-heading, .heading-text {
        font-size: clamp(1.75rem, 2.5vw, 2.5rem);
        line-height: 1.2;
      }
      .sub-heading, .sub-text, .page-subtitle, .welcome-subtitle, .card-subtitle {
        font-size: clamp(1rem, 1.25vw, 1.2rem);
        line-height: 1.5;
      }
      .form-card, .login-card, .info-card, .patient-card, .details-card, .hospital-card, .qr-card, .emergency-card, .form-card, .profile-card {
        width: min(100%, 760px);
        margin-left: auto;
        margin-right: auto;
        padding: clamp(24px, 3vw, 40px);
      }
      .form-label, .checkbox-label, .detail-label, .info-label, .record-title, .section-title, .card-title {
        font-size: clamp(1rem, 1.2vw, 1.15rem);
      }
      .form-input, .form-select, .dropdown-select, .otp-box {
        min-height: 48px;
        font-size: clamp(1rem, 1.15vw, 1.1rem);
      }
      button, .btn-primary, .btn-secondary, .btn-login, .btn-submit, .btn-verify, .btn-continue, .btn-done, .btn-request, .btn-send, .btn-approve, .btn-reject, .btn-dashboard, .btn-view-profile, .btn-share, .btn-create-account {
        min-height: 50px;
        font-size: clamp(1rem, 1.15vw, 1.1rem);
      }
      .screen-layout {
        width: min(100%, 1440px);
        min-height: calc(100vh - 64px);
        min-height: calc(100dvh - 64px);
        margin: 0 auto;
      }
      .sidebar-drawer { font-size: clamp(1rem, 1.1vw, 1.15rem); }
      .peek-card, .peek-card-top, .peek-card-bottom { font-size: clamp(1rem, 1.1vw, 1.15rem); }
      .navbar, .bottom-nav { min-height: 72px; }
      .nav-item { width: 48px; height: 48px; }
      .nav-item svg { width: 22px; height: 22px; }
    }
    @media (max-width: 700px) {
      body { background: #ffffff; }
      .phone-mockup { max-width: none; min-height: 100dvh; }
      .app-content { min-height: calc(100dvh - 56px); padding: 22px 16px 24px; }
      .navbar { position: sticky; min-height: 56px; padding: 10px 12px; }
      .horizontal-scroll, .quick-access-grid { flex-wrap: wrap; }
      .horizontal-scroll { overflow-x: visible; }
      .profile-card { flex: 1 1 82px; }
    }
    @media (max-width: 380px) {
      .app-content { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <div class="notch"></div>

    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 16 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"/>
          <rect x="4" y="6" width="3" height="6" rx="0.5"/>
          <rect x="8" y="3" width="3" height="9" rx="0.5"/>
          <rect x="12" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <svg class="icon-wifi" viewBox="0 0 16 12">
          <path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0l-1.41 1.41a4 4 0 0 0-5.66 0L3.76 6.67zm-2.83-2.83a10 10 0 0 1 14.14 0l-1.41 1.41a8 8 0 0 0-11.32 0L.93 3.84z"/>
        </svg>
        <div class="icon-battery">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <div class="app-content">
      <div class="form-card">
        <div class="stepper">
          <div class="step-circle completed">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="step-circle completed">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="step-circle completed">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="step-circle active">4</div>
        </div>
        <p class="step-indicator">4 of 4</p>

        <h1 class="card-title">Previous procedures</h1>
        <p class="card-subtitle">Add any major surgeries or<br>procedures you'd like healthcare<br>providers to know about</p>

        <form onsubmit="event.preventDefault();" style="display: flex; flex-direction: column; flex: 1;">
          <div class="empty-state-box">
            <p class="empty-state-text">No procedures added</p>
            <button type="button" class="btn-add-procedure">
              <span style="font-size: 0.9rem;">+</span> Add procedure
            </button>
          </div>

          <button type="submit" class="btn-continue">Continue</button>
        </form>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>

  <script src="medtrace-navigation.js"></script>
</body>
</html>
