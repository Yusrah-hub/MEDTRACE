<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Your QR Code</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* iPhone Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #f8fafc;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 28px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      z-index: 5;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-signal { width: 14px; height: 10px; fill: #000000; }
    .icon-wifi { width: 13px; height: 10px; fill: #000000; }
    .icon-battery {
      width: 20px;
      height: 10px;
      border: 1px solid #000000;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }
    .icon-battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 100%;
      height: 100%;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 32px 20px;
    }

    .card-title {
      color: #64748b;
      font-weight: 700;
      font-size: 1.1rem;
      text-align: center;
      margin-top: 10px;
    }

    /* QR Code Container Card */
    .qr-card {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 290px;
    }

    /* SVG QR Code Illustration */
    .qr-code-svg {
      width: 200px;
      height: 200px;
    }

    /* Instruction Subtitle */
    .qr-instructions {
      text-align: center;
      font-size: 0.72rem;
      color: #334155;
      font-weight: 500;
      line-height: 1.4;
      max-width: 240px;
      margin-bottom: 8px;
    }

    /* Action Buttons Area */
    .action-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-share {
      display: block;
      width: 100%;
      background-color: #1976d2;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 13px 0;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-view-profile {
      background: none;
      border: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: none;
    }

    /* Home Indicator Notch */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  
    /* Full web app layout: reuse each original screen design without a device frame. */
    html { min-height: 100%; }
    body {
      display: block;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0;
      background: #f4f7fb;
      align-items: initial;
      justify-content: initial;
    }
    .phone-mockup {
      width: 100%;
      max-width: 1440px;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
      position: relative;
    }
    .notch, .status-bar, .home-indicator { display: none !important; }
    .app-content {
      width: 100%;
      min-height: calc(100vh - 64px);
      min-height: calc(100dvh - 64px);
      height: auto;
      flex: 1 0 auto;
      overflow: visible;
      padding: clamp(24px, 4vw, 56px) clamp(20px, 6vw, 88px) 32px;
      overscroll-behavior: auto;
    }
    .navbar {
      position: sticky;
      bottom: 0;
      z-index: 20;
      width: 100%;
      min-height: 64px;
      height: auto;
      padding: 12px 20px;
      border-top: 1px solid #e5eaf1;
      background: #ffffff;
    }
    img, svg, video, canvas { max-width: 100%; }
    input, select, textarea, button { max-width: 100%; }
    @media (min-width: 900px) {
      .app-content { padding-left: clamp(48px, 8vw, 112px); padding-right: clamp(48px, 8vw, 112px); }
    }
    /* DESKTOP-FIT-RULES */
    @media (min-width: 900px) {
      .app-content {
        min-height: calc(100vh - 136px);
        min-height: calc(100dvh - 136px);
        padding-left: clamp(48px, 7vw, 112px);
        padding-right: clamp(48px, 7vw, 112px);
      }
      .page-title, .app-title, .form-title, .main-heading, .heading-text {
        font-size: clamp(1.75rem, 2.5vw, 2.5rem);
        line-height: 1.2;
      }
      .sub-heading, .sub-text, .page-subtitle, .welcome-subtitle, .card-subtitle {
        font-size: clamp(1rem, 1.25vw, 1.2rem);
        line-height: 1.5;
      }
      .form-card, .login-card, .info-card, .patient-card, .details-card, .hospital-card, .qr-card, .emergency-card, .form-card, .profile-card {
        width: min(100%, 760px);
        margin-left: auto;
        margin-right: auto;
        padding: clamp(24px, 3vw, 40px);
      }
      .form-label, .checkbox-label, .detail-label, .info-label, .record-title, .section-title, .card-title {
        font-size: clamp(1rem, 1.2vw, 1.15rem);
      }
      .form-input, .form-select, .dropdown-select, .otp-box {
        min-height: 48px;
        font-size: clamp(1rem, 1.15vw, 1.1rem);
      }
      button, .btn-primary, .btn-secondary, .btn-login, .btn-submit, .btn-verify, .btn-continue, .btn-done, .btn-request, .btn-send, .btn-approve, .btn-reject, .btn-dashboard, .btn-view-profile, .btn-share, .btn-create-account {
        min-height: 50px;
        font-size: clamp(1rem, 1.15vw, 1.1rem);
      }
      .screen-layout {
        width: min(100%, 1440px);
        min-height: calc(100vh - 64px);
        min-height: calc(100dvh - 64px);
        margin: 0 auto;
      }
      .sidebar-drawer { font-size: clamp(1rem, 1.1vw, 1.15rem); }
      .peek-card, .peek-card-top, .peek-card-bottom { font-size: clamp(1rem, 1.1vw, 1.15rem); }
      .navbar, .bottom-nav { min-height: 72px; }
      .nav-item { width: 48px; height: 48px; }
      .nav-item svg { width: 22px; height: 22px; }
    }
    @media (max-width: 700px) {
      body { background: #ffffff; }
      .phone-mockup { max-width: none; min-height: 100dvh; }
      .app-content { min-height: calc(100dvh - 56px); padding: 22px 16px 24px; }
      .navbar { position: sticky; min-height: 56px; padding: 10px 12px; }
      .horizontal-scroll, .quick-access-grid { flex-wrap: wrap; }
      .horizontal-scroll { overflow-x: visible; }
      .profile-card { flex: 1 1 82px; }
    }
    @media (max-width: 380px) {
      .app-content { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <div class="notch"></div>

    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 16 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"/>
          <rect x="4" y="6" width="3" height="6" rx="0.5"/>
          <rect x="8" y="3" width="3" height="9" rx="0.5"/>
          <rect x="12" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <svg class="icon-wifi" viewBox="0 0 16 12">
          <path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0l-1.41 1.41a4 4 0 0 0-5.66 0L3.76 6.67zm-2.83-2.83a10 10 0 0 1 14.14 0l-1.41 1.41a8 8 0 0 0-11.32 0L.93 3.84z"/>
        </svg>
        <div class="icon-battery">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <div class="app-content">
      <h1 class="card-title">Your MedTrace QR</h1>

      <div class="qr-card">
        <svg class="qr-code-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="10" width="50" height="50" rx="4" fill="#000000"/>
          <rect x="18" y="18" width="34" height="34" rx="2" fill="#ffffff"/>
          <rect x="24" y="24" width="22" height="22" rx="1" fill="#000000"/>

          <rect x="140" y="10" width="50" height="50" rx="4" fill="#000000"/>
          <rect x="148" y="18" width="34" height="34" rx="2" fill="#ffffff"/>
          <rect x="154" y="24" width="22" height="22" rx="1" fill="#000000"/>

          <rect x="10" y="140" width="50" height="50" rx="4" fill="#000000"/>
          <rect x="18" y="148" width="34" height="34" rx="2" fill="#ffffff"/>
          <rect x="24" y="154" width="22" height="22" rx="1" fill="#000000"/>

          <rect x="70" y="10" width="12" height="12" fill="#000000"/>
          <rect x="90" y="10" width="12" height="24" fill="#000000"/>
          <rect x="110" y="10" width="20" height="12" fill="#000000"/>

          <rect x="70" y="30" width="20" height="12" fill="#000000"/>
          <rect x="100" y="26" width="12" height="20" fill="#000000"/>
          <rect x="120" y="30" width="12" height="12" fill="#000000"/>

          <rect x="10" y="70" width="24" height="12" fill="#000000"/>
          <rect x="42" y="70" width="12" height="24" fill="#000000"/>
          <rect x="62" y="50" width="12" height="30" fill="#000000"/>

          <rect x="140" y="70" width="20" height="12" fill="#000000"/>
          <rect x="170" y="62" width="20" height="20" fill="#000000"/>

          <rect x="10" y="90" width="12" height="20" fill="#000000"/>
          <rect x="30" y="100" width="24" height="12" fill="#000000"/>
          <rect x="160" y="90" width="30" height="12" fill="#000000"/>

          <rect x="70" y="140" width="20" height="12" fill="#000000"/>
          <rect x="100" y="130" width="12" height="30" fill="#000000"/>
          <rect x="120" y="140" width="20" height="20" fill="#000000"/>
          <rect x="150" y="130" width="12" height="20" fill="#000000"/>

          <rect x="70" y="170" width="12" height="20" fill="#000000"/>
          <rect x="90" y="160" width="24" height="12" fill="#000000"/>
          <rect x="120" y="170" width="30" height="12" fill="#000000"/>
          <rect x="160" y="160" width="20" height="30" fill="#000000"/>

          <rect x="72" y="72" width="56" height="56" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
          <text x="100" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#000000" text-anchor="middle">SCAN</text>
          <text x="100" y="112" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#000000" text-anchor="middle">ME</text>
        </svg>
      </div>

      <p class="qr-instructions">
        Show this code to an authorized healthcare provider to request access to your medical information
      </p>

      <div class="action-group">
        <button class="btn-share">Share QR</button>
        <button class="btn-view-profile">View Emergency Profile</button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>

  <script src="medtrace-navigation.js"></script>
</body>
</html>
