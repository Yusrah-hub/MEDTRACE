[build]
  base = "medtrace-react-app"
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://medtrace-l2k9.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://medtrace-l2k9.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
